[project]
name = "rancher-keycloak-operator"
version = "0.0.3"
description = "Kubernetes operator for managing Rancher projects and Keycloak groups via CRDs"
requires-python = ">=3.10"
dependencies = [
    "kopf>=1.37",
    "kubernetes>=28.1",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["rancher_keycloak_operator*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
