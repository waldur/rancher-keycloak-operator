apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rancherprojectinventories.waldur.io
spec:
  group: waldur.io
  names:
    kind: RancherProjectInventory
    listKind: RancherProjectInventoryList
    plural: rancherprojectinventories
    singular: rancherprojectinventory
    shortNames:
      - rpi
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Managed
          type: integer
          jsonPath: .status.managedProjects
        - name: Unmanaged
          type: integer
          jsonPath: .status.unmanagedProjectCount
        - name: Last Scan
          type: date
          jsonPath: .status.lastScanTime
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clusterId
              properties:
                clusterId:
                  type: string
                  description: "Rancher cluster ID to scan"
                scanIntervalSeconds:
                  type: integer
                  default: 300
                  description: "Seconds between discovery scans"
            status:
              type: object
              properties:
                lastScanTime:
                  type: string
                  format: date-time
                managedProjects:
                  type: integer
                unmanagedProjectCount:
                  type: integer
                unmanagedProjects:
                  type: array
                  items:
                    type: object
                    properties:
                      projectId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      namespaces:
                        type: array
                        items:
                          type: string
                      createdAt:
                        type: string
